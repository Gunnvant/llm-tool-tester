[tool.ruff]
line-length = 120
exclude = ["venv", ".venv", "__pycache__", ".git", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv", ".venv", "__pycache__", ".git", "build", "dist"]
