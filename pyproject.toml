[project]
name = "llm-tool-tester"
version = "0.1.0"
description = "Framework for evaluating tool-calling capabilities of local LLMs"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "function-schema>=0.4.5",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ruff>=0.4.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
]

[tool.ruff]
line-length = 120
exclude = ["venv", ".venv", "__pycache__", ".git", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv", ".venv", "__pycache__", ".git", "build", "dist"]
