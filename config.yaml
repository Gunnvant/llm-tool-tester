# Model registry for llama-server instances.
# Each entry gets its own --port so you can test multiple models back-to-back.
#
# IMPORTANT:
# 1. Update gguf_path to point to real GGUF files on your machine.
# 2. Download GGUFs directly from HuggingFace (e.g. ggml-org/gemma-3-1b-it-GGUF).
#    Ollama blob files CANNOT be used directly by llama.cpp.
# 3. The server is started with --jinja so that tool_calls are enabled.
# 4. chat_template maps to llama-server's built-in template names.
#    Use 'gemma' for Gemma/ToolGemma models.

models:
  gemma-4-E2B-it-Q4-NL:
    gguf_path: ./models/gemma-4-E2B-it-IQ4_NL.gguf
    port: 8080
    context_size: 4096

